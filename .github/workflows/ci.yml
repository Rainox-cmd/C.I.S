name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Build and Test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Git identity for tests
        run: |
          git config --global user.name "C.I.S. CI"
          git config --global user.email "ci@cis.local"

      - name: Build
        run: cargo build --bins

      - name: Unit tests
        run: cargo test --bins -- --test-threads=4

      - name: Integration tests
        run: cargo test --test integration_tests -- --test-threads=1

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
