[package]
name = "cis"
version = "1.0.0"
edition = "2021"
authors = ["C.I.S. Developers"]
license = "MIT"
description = "Codebase Intelligence System - Rust code intelligence with MCP integration"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
thiserror = "1.0"
anyhow = "1.0"
dirs = "5.0"
sha2 = "0.10"
walkdir = "2.5"
regex = "1.10"
chrono = "0.4"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.10"
assert_fs = "1.1"
predicates = "3.1"
